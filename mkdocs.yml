site_name: iNiR Wiki
site_description: Documentation for the iNiR Wayland desktop shell
site_url: https://snowarch.github.io/iNiR/
repo_url: https://github.com/snowarch/iNiR
repo_name: snowarch/iNiR
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: wiki
exclude_docs: |
  superpowers/*
  powerspec/*
  readme/*
  plans/*
  agents/*
  javascripts/*.md

copyright: iNiR —&nbsp;a desktop shell for Niri

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg

  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

  features:
    # Navigation
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer

    # Table of contents
    - toc.follow

    # Search
    - search.suggest
    - search.highlight
    - search.share

    # Code
    - content.code.copy
    - content.code.annotate
    - content.code.select

    # Tooltips & tabs
    - content.tooltips
    - content.tabs.link

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3

  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: snowarch
      repo: inir
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/snowarch/inir
      name: GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/pAPTfAhZUJ
      name: Discord

  # Analytics (uncomment and add key to enable)
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX

  # Version provider (uncomment if using mike for versioning)
  # version:
  #   provider: mike

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md

  - Getting Started:
      - Installation: INSTALL.md
      - Setup & Update: SETUP.md
      - Packages: PACKAGES.md
      - NixOS: NIXOS.md

  - Architecture:
      - Architecture Overview: ARCHITECTURE_OVERVIEW.md
      - Project Map: PROJECT_MAP.md
      - Runtime & Boot Pipeline: RUNTIME.md
      - Config System: CONFIG_SYSTEM.md
      - Panel Families: PANEL_FAMILIES.md
      - Compositor Integration: COMPOSITORS.md

  - Shell Reference:
      - IPC Targets: IPC.md
      - Keybinds: KEYBINDS.md
      - Services Catalog: SERVICES.md
      - Modules Catalog: MODULES.md
      - Calendar Integration: CALENDAR.md
      - Wallpaper System: WALLPAPER.md
      - Audio & Media: AUDIO_MEDIA.md
      - Notifications: NOTIFICATIONS.md
      - Autostart & Session: AUTOSTART.md
      - Global Actions: GLOBAL_ACTIONS.md
      - Known Limitations: LIMITATIONS.md

  - Theming:
      - Pipeline Architecture: THEMING_ARCHITECTURE.md
      - Theme Presets Catalog: THEMING_PRESETS.md
      - Theming Targets: THEMING_TARGETS.md
      - Writing a Module: THEMING_MODULES.md
      - Vesktop / Discord: VESKTOP.md

  - Contributor Guide:
      - QML Performance: OPTIMIZATION.md

# Note: docs/readme/*.md, docs/superpowers/, docs/powerspec/, docs/agents/,
# and docs/javascripts/*.md are intentionally excluded from the nav and the
# build via MkDocs' native exclude_docs option. They are repo/agent tooling,
# not wiki content.
