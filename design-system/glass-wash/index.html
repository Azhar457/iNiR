<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>zzz · GlassWash</title>
<style>
:root{--bg0:#0a0a0c;--ink:#ededf0;--inkMuted:#8d8d93;--accent:#e9743a;--secondary:#c3d63f;
--hairlineStrong:rgba(237,237,240,.30);--font:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:#06060a;color:var(--ink);font-family:var(--font);padding:30px}
h1{font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:900;margin:0 0 4px}
.sub{color:var(--inkMuted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 24px}
.stage{position:relative;width:340px;height:180px;
  background:radial-gradient(120% 120% at 20% 10%,#3a6e74,#7a4a2e 55%,#1a1320 100%);overflow:hidden;border-radius:3px}
.wash{position:absolute;inset:0;backdrop-filter:blur(14px);
  background:linear-gradient(120% 0,rgba(10,10,12,.62),rgba(10,10,12,.40));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%);
  border:1px solid var(--hairlineStrong)}
.sheen{position:absolute;top:0;left:0;right:0;height:42%;background:linear-gradient(rgba(237,237,240,.10),transparent)}
.lbl{position:absolute;left:16px;bottom:16px;font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--inkMuted)}
</style></head><body>
<h1>ZzzGlassWash</h1><p class="sub">Wallpaper-glass wash — blurred hue + sheen on chamfered mask</p>
<div class="stage"><div class="wash"><div class="sheen"></div></div><div class="lbl">// carries wallpaper hue only</div></div>
<p class="sub" style="margin-top:22px">Caller still owns the final plate fill/stroke. Gated on effects + zzz.glass config.</p>
</body></html>
