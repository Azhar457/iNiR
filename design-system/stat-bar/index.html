<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>zzz · StatBar</title>
<style>
:root{--bg0:#0a0a0c;--bg1:#101014;--bg2:#17171c;--ink:#ededf0;--inkMuted:#8d8d93;
--accent:#e9743a;--secondary:#c3d63f;--metricTrack:rgba(237,237,240,.12);
--hairline:rgba(237,237,240,.18);--font:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:var(--bg0);color:var(--ink);font-family:var(--font);padding:30px}
h1{font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:900;margin:0 0 4px}
.sub{color:var(--inkMuted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 24px}
.stat{width:320px;background:var(--bg2);border:1px solid var(--hairline);border-radius:2px;padding:9px 11px;margin-bottom:10px}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.lbl{font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
.val{margin-left:auto;font-family:'Rubik',sans-serif;font-weight:700;font-size:13px}
.rail{display:flex;gap:2px}
.seg{flex:1;height:8px;background:var(--metricTrack)}
.seg.on{background:var(--accent)}
.seg.lime{background:var(--secondary)}
</style>
<script>
function rail(el,n,fill,cls){let h='';for(let i=0;i<18;i++)h+=`<div class="seg ${i<Math.round(n*18)?(cls||'on'):''}"></div>`;el.innerHTML=h;}
</script></head><body>
<h1>ZzzStatBar</h1><p class="sub">Industrial metric row — label, readout, 18-segment rail</p>
<div class="stat"><div class="top"><span class="lbl">CPU LOAD</span><span class="val">68%</span></div><div class="rail" id="r1"></div></div>
<div class="stat"><div class="top"><span class="lbl">MEMORY</span><span class="val">41%</span></div><div class="rail" id="r2"></div></div>
<div class="stat"><div class="top"><span class="lbl">UPLINK</span><span class="val">23%</span></div><div class="rail" id="r3"></div></div>
<script>rail(r1,.68);rail(r2,.41);rail(r3,.23,'lime','lime');</script>
</body></html>
