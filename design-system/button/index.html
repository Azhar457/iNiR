<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>zzz · Button</title>
<style>
:root{--bg0:#0a0a0c;--bg2:#17171c;--ink:#ededf0;--inkMuted:#8d8d93;
--accent:#e9743a;--onAccent:#160a04;--sticker:#c25a2c;--onSticker:#fff;
--hairlineStrong:rgba(237,237,240,.30);--font:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:var(--bg0);color:var(--ink);font-family:var(--font);padding:30px}
h1{font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:900;margin:0 0 4px}
.sub{color:var(--inkMuted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 22px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{padding:11px 20px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:12px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
.primary{background:var(--accent);color:var(--onAccent)}
.secondary{background:var(--sticker);color:var(--onSticker)}
.ghost{background:transparent;color:var(--ink);outline:1px solid var(--hairlineStrong);outline-offset:-1px}
.disabled{background:var(--bg2);color:var(--inkMuted)}
</style></head><body>
<h1>Button · botón</h1><p class="sub">Acción primaria / secundaria / fantasma / deshabilitado</p>
<div class="row">
  <button class="btn primary">Aceptar</button>
  <button class="btn secondary">Opción</button>
  <button class="btn ghost">Cancelar</button>
  <button class="btn disabled">No disp.</button>
</div>
</body></html>
