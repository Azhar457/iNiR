<!-- @dsCard group="Surfaces" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>zzz · Plate</title>
<style>
:root{--bg0:#0a0a0c;--bg1:#101014;--bg2:#17171c;--bg3:#1f1f25;--ink:#ededf0;--inkMuted:#8d8d93;
--accent:#e9743a;--secondary:#c3d63f;--border:#5a5a5e;--hairlineStrong:rgba(237,237,240,.30);
--font:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:var(--bg0);color:var(--ink);font-family:var(--font);padding:30px}
h1{font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:900;margin:0 0 4px}
.sub{color:var(--inkMuted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 24px}
.row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.cap{margin-top:9px;color:var(--inkMuted);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.plate{width:170px;height:108px;display:flex;align-items:center;justify-content:center;
  font-weight:900;letter-spacing:.16em;text-transform:uppercase;font-size:12px}
.br{clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%)}
.tl{clip-path:polygon(16px 0,100% 0,100% 100%,0 100%,0 16px)}
.both{clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.fill{background:var(--bg2)}.stroke{background:var(--bg1);outline:1px solid var(--hairlineStrong);outline-offset:-1px}
.signal{background:var(--accent);color:#160a04}
</style></head><body>
<h1>ZzzPlate</h1><p class="sub">Signature surface — true 45° chamfered corner geometry</p>
<div class="row">
  <div><div class="plate fill br">bottom-right</div><div class="cap">default · single cut</div></div>
  <div><div class="plate stroke br">stroked</div><div class="cap">fill + hairline</div></div>
  <div><div class="plate fill both">dual cut</div><div class="cap">stronger statement</div></div>
  <div><div class="plate signal br">signal</div><div class="cap">accent fill</div></div>
</div>
<p class="sub" style="margin-top:26px">The chamfer is real outline geometry (QtQuick.Shapes), not an overlay sticker. Round mode swaps it for a native radius.</p>
</body></html>
