<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>zzz · Slider</title>
<style>
:root{--bg0:#0a0a0c;--bg2:#17171c;--ink:#ededf0;--inkMuted:#8d8d93;
--accent:#e9743a;--accentSoft:#d8682f;--track:rgba(237,237,240,.14);
--font:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:var(--bg0);color:var(--ink);font-family:var(--font);padding:30px}
h1{font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:900;margin:0 0 4px}
.sub{color:var(--inkMuted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 24px}
.slot{width:300px;margin-bottom:22px}
.lab{display:flex;justify-content:space-between;font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-bottom:7px}
.lab span:last-child{font-family:'Rubik',sans-serif;color:var(--accent)}
.track{height:8px;background:var(--track);position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--accentSoft)}
.knob{position:absolute;top:-3px;width:6px;height:14px;background:var(--accent)}
</style></head><body>
<h1>Slider · deslizador</h1><p class="sub">Riel + relleno de señal + manija cuadrada</p>
<div class="slot"><div class="lab"><span>Volumen</span><span>72%</span></div>
  <div class="track"><div class="fill" style="width:72%"></div><div class="knob" style="left:72%"></div></div></div>
<div class="slot"><div class="lab"><span>Brillo</span><span>35%</span></div>
  <div class="track"><div class="fill" style="width:35%"></div><div class="knob" style="left:35%"></div></div></div>
</body></html>
