<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>zzz · SurfaceAccent</title>
<style>
:root{--bg0:#0a0a0c;--bg1:#101014;--bg2:#17171c;--ink:#ededf0;--inkMuted:#8d8d93;
--accent:#e9743a;--onAccent:#160a04;--secondary:#c3d63f;--hairline:rgba(237,237,240,.18);
--font:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:var(--bg0);color:var(--ink);font-family:var(--font);padding:30px}
h1{font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:900;margin:0 0 4px}
.sub{color:var(--inkMuted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 24px}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.cap{margin-top:8px;color:var(--inkMuted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.surf{position:relative;width:190px;height:104px;background:var(--bg2);border:1px solid var(--hairline);border-radius:3px;overflow:hidden}
.tape{position:absolute;top:0;left:0;right:0;height:3px;
  background:repeating-linear-gradient(90deg,var(--accent) 0 9px,transparent 9px 13px)}
.sticker{position:absolute;top:10px;right:10px;width:38px;height:12px;background:var(--accent);
  clip-path:polygon(0 0,100% 0,100% 100%,4px 100%,0 calc(100% - 4px))}
</style></head><body>
<h1>ZzzSurfaceAccent</h1><p class="sub">Thin registration rail + opt-in role sticker — surface treatment layer</p>
<div class="row">
  <div><div class="surf"><div class="tape"></div></div><div class="cap">tape rail (18 stripes)</div></div>
  <div><div class="surf"><div class="tape"></div><div class="sticker"></div></div><div class="cap">+ role sticker</div></div>
</div>
</body></html>
