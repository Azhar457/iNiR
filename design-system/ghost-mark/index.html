<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>zzz · GhostMark</title>
<style>
:root{--bg0:#0a0a0c;--bg1:#101014;--ink:#ededf0;--inkMuted:#8d8d93;--accent:#e9743a;
--font:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:var(--bg0);color:var(--ink);font-family:var(--font);padding:30px}
h1{font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:900;margin:0 0 4px}
.sub{color:var(--inkMuted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 24px}
.stage{position:relative;width:360px;height:180px;background:var(--bg1);border:1px solid rgba(237,237,240,.18);overflow:hidden;border-radius:3px}
.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:96px;font-weight:900;font-style:italic;letter-spacing:.04em;
  color:rgba(237,237,240,.05);user-select:none;white-space:nowrap}
.content{position:absolute;left:16px;bottom:14px;font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--inkMuted)}
</style></head><body>
<h1>ZzzGhostMark</h1><p class="sub">Giant faint wordmark watermark — panel signature, behind content</p>
<div class="stage"><div class="ghost">Z·Z·Z</div><div class="content">// strength 1.0 · ~5% ink</div></div>
<p class="sub" style="margin-top:22px">Generated ink at ~5–6% alpha, italic black title font. Zero cost when zzz inactive.</p>
</body></html>
