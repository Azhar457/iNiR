<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>zzz · PanelBackdrop</title>
<style>
:root{--bg0:#0a0a0c;--bg1:#101014;--bg2:#17171c;--ink:#ededf0;--inkMuted:#8d8d93;
--accent:#e9743a;--secondary:#c3d63f;--hairline:rgba(237,237,240,.18);
--font:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:#000;color:var(--ink);font-family:var(--font);padding:30px}
h1{font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:900;margin:0 0 4px}
.sub{color:var(--inkMuted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 24px}
.panel{position:relative;width:360px;height:210px;background:
  repeating-linear-gradient(135deg,transparent 0 22px,rgba(237,237,240,.025) 22px 23px),
  radial-gradient(120% 90% at 100% 0%,rgba(233,116,58,.10),transparent 60%),
  var(--bg0);border:1px solid var(--hairline);overflow:hidden}
.hz{position:absolute;left:0;right:0;height:18px;background:
  repeating-linear-gradient(45deg,var(--accent) 0 14px,#160a04 14px 28px);opacity:.85}
.hz.top{top:0}.label{position:absolute;bottom:14px;left:16px;font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--inkMuted)}
.ghost{position:absolute;right:-10px;bottom:-30px;font-size:130px;font-weight:900;color:rgba(237,237,240,.04);line-height:.8}
</style></head><body>
<h1>ZzzPanelBackdrop</h1><p class="sub">Console ground — diagonal hatch, hazard rail, corner hue bloom, ghost mark</p>
<div class="panel">
  <div class="hz top"></div>
  <div class="ghost">Z</div>
  <div class="label">// backdrop layer 0</div>
</div>
</body></html>
