<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>zzz · GlyphBadge</title>
<style>
:root{--bg0:#0a0a0c;--bg2:#17171c;--ink:#ededf0;--inkMuted:#8d8d93;
--accent:#e9743a;--sticker:#c25a2c;--onSticker:#fff;--secondary:#c3d63f;
--font:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:var(--bg0);color:var(--ink);font-family:var(--font);padding:30px}
h1{font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:900;margin:0 0 4px}
.sub{color:var(--inkMuted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 24px}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.cap{margin-top:8px;color:var(--inkMuted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.badge{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;border-radius:2px;
  border:1px solid var(--sticker);clip-path:polygon(0 0,100% 0,100% 100%,7px 100%,0 calc(100% - 7px))}
.ghost{background:rgba(194,90,44,.18);color:var(--sticker)}
.filled{background:var(--sticker);color:var(--onSticker)}
.lime{background:var(--secondary);color:#13150a;border-color:var(--secondary)}
</style></head><body>
<h1>ZzzGlyphBadge</h1><p class="sub">Compact technical glyph carrier with corner-cut cue</p>
<div class="row">
  <div><div class="badge ghost">◈</div><div class="cap">ghost</div></div>
  <div><div class="badge filled">▣</div><div class="cap">filled</div></div>
  <div><div class="badge lime">⬡</div><div class="cap">lime</div></div>
  <div><div class="badge ghost">⚙</div><div class="cap">glyph</div></div>
</div>
</body></html>
