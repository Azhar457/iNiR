<!-- @dsCard group="Surfaces" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>zzz · PlateCard</title>
<style>
:root{--bg0:#0a0a0c;--bg1:#101014;--bg2:#17171c;--bg3:#1f1f25;--ink:#ededf0;--inkMuted:#8d8d93;
--accent:#e9743a;--secondary:#c3d63f;--border:#5a5a5e;--hairline:rgba(237,237,240,.18);
--font:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:var(--bg0);color:var(--ink);font-family:var(--font);padding:30px}
h1{font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:900;margin:0 0 4px}
.sub{color:var(--inkMuted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 24px}
.card{width:300px;background:var(--bg2);border:1px solid var(--hairline);padding:16px 18px 18px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}
.hdr{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.tick{width:3px;height:16px;background:var(--accent)}
.title{font-size:13px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
.idx{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--inkMuted);letter-spacing:.1em}
.body{color:var(--inkMuted);font-size:12px;line-height:1.6;letter-spacing:.03em}
.foot{display:flex;gap:8px;margin-top:16px}
.pill{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;
  background:var(--bg0);border:1px solid var(--hairline);color:var(--secondary)}
</style></head><body>
<h1>ZzzPlateCard</h1><p class="sub">Console card — header tick + index + chamfered plate body</p>
<div class="card">
  <div class="hdr"><div class="tick"></div><div class="title">System</div><div class="idx">02 / 14</div></div>
  <div class="body">A composed surface on the chamfered plate. Header registration tick in the accent role, monospace index marker, restrained carbon body with the wallpaper hue reading through.</div>
  <div class="foot"><div class="pill">active</div><div class="pill" style="color:var(--accent)">signal</div></div>
</div>
</body></html>
