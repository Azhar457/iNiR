<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>zzz · GraphicPlate</title>
<style>
:root{--bg0:#0a0a0c;--paper:#101014;--ink:#ededf0;--inkMuted:#8d8d93;--accent:#e9743a;--secondary:#c3d63f;
--hairlineStrong:rgba(237,237,240,.30);--ghost:rgba(237,237,240,.05);
--font:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:var(--bg0);color:var(--ink);font-family:var(--font);padding:30px}
h1{font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:900;margin:0 0 4px}
.sub{color:var(--inkMuted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 24px}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.cap{margin-top:8px;color:var(--inkMuted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.plate{position:relative;width:200px;height:120px;background:var(--paper);border:1px solid var(--hairlineStrong);
  border-radius:3px;overflow:hidden;padding:16px 16px 16px 22px}
.plate::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.title{font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
.opt{background:
  repeating-linear-gradient(135deg,transparent 0 10px,rgba(237,237,240,.05) 10px 11px),var(--paper)}
.ghost{position:absolute;right:-6px;bottom:-24px;font-size:92px;font-weight:900;font-style:italic;color:var(--ghost);line-height:.8}
.tape{position:absolute;top:0;left:0;right:0;height:4px;background:repeating-linear-gradient(45deg,var(--accent) 0 10px,#160a04 10px 20px)}
</style></head><body>
<h1>ZzzGraphicPlate</h1><p class="sub">Clean plate, left accent bar — heavy ornaments opt-in</p>
<div class="row">
  <div><div class="plate"><div class="title">Clean</div></div><div class="cap">default · accent bar only</div></div>
  <div><div class="plate opt"><div class="tape"></div><div class="title">Loaded</div><div class="ghost">Z</div></div><div class="cap">tape + hatch + ghost</div></div>
</div>
</body></html>
