<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>zzz · DiagonalPattern</title>
<style>
:root{--bg0:#0a0a0c;--ink:#ededf0;--inkMuted:#8d8d93;--accent:#e9743a;--secondary:#c3d63f;
--font:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:var(--bg0);color:var(--ink);font-family:var(--font);padding:30px}
h1{font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:900;margin:0 0 4px}
.sub{color:var(--inkMuted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 24px}
.row{display:flex;gap:18px;flex-wrap:wrap}
.cap{margin-top:8px;color:var(--inkMuted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.sw{width:150px;height:96px;border:1px solid rgba(237,237,240,.18)}
.faint{background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(237,237,240,.06) 9px 10px)}
.hazard{background:repeating-linear-gradient(45deg,var(--accent) 0 12px,#160a04 12px 24px)}
.lime{background:repeating-linear-gradient(45deg,var(--secondary) 0 12px,#13150a 12px 24px)}
</style></head><body>
<h1>ZzzDiagonalPattern</h1><p class="sub">Generated-color hatching — texture & hazard rails</p>
<div class="row">
  <div><div class="sw faint"></div><div class="cap">faint texture</div></div>
  <div><div class="sw hazard"></div><div class="cap">hazard · accent</div></div>
  <div><div class="sw lime"></div><div class="cap">hazard · lime</div></div>
</div>
</body></html>
