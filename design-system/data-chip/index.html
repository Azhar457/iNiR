<!-- @dsCard group="Signals" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>zzz · DataChip</title>
<style>
:root{--bg0:#0a0a0c;--bg1:#101014;--ink:#ededf0;--inkMuted:#8d8d93;
--accent:#e9743a;--secondary:#c3d63f;--onAccent:#160a04;
--contrastPlate:#dcd9d5;--onContrastPlate:#141414;--hairlineStrong:rgba(237,237,240,.30);
--font:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box}body{margin:0;background:var(--bg0);color:var(--ink);font-family:var(--font);padding:30px}
h1{font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:900;margin:0 0 4px}
.sub{color:var(--inkMuted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 24px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 11px;border-radius:2px;
  font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.plate{background:var(--contrastPlate);color:var(--onContrastPlate);border:1px solid var(--hairlineStrong)}
.tick{width:2px;height:11px;background:var(--accent)}
.val{font-family:'JetBrains Mono',monospace;font-weight:700;opacity:.8}
.signal{background:var(--accent);color:var(--onAccent)}
.lime{background:var(--secondary);color:#13150a}
</style></head><body>
<h1>ZzzDataChip</h1><p class="sub">Capsule label — uppercase key + optional readout</p>
<div class="row">
  <span class="chip plate"><span class="tick"></span>CPU<span class="val">42%</span></span>
  <span class="chip plate"><span class="tick" style="background:var(--secondary)"></span>NET<span class="val">1.2G</span></span>
  <span class="chip signal">REC<span class="val">●</span></span>
  <span class="chip lime">ONLINE</span>
</div>
<p class="sub" style="margin-top:24px">plate = inverse contrast capsule with category tick · signal = filled accent</p>
</body></html>
